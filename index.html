<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тилек — Робот & Калькулятор (v1.0.5)</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171b2e; --panel2:#1f2540;
    --accent:#4f8cff; --accent2:#22d3ee; --ok:#22c55e;
    --err:#ef4444; --text:#e6e9f5; --muted:#9aa3bd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%, #1b2a5a 0%, var(--bg) 60%);
    color:var(--text); min-height:100vh; padding:16px;
  }
  .wrap{max-width:720px; margin:0 auto}
  header{display:flex; align-items:center; gap:12px; margin-bottom:16px}
  .logo{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:24px;
    box-shadow:0 8px 24px rgba(79,140,255,.35);
  }
  h1{font-size:20px;margin:0}
  .ver{font-size:12px;color:var(--muted)}
  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid rgba(255,255,255,.06);
    border-radius:18px; padding:16px; margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .card h2{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  /* ---- Чат ---- */
  #chat{
    height:260px; overflow-y:auto; padding:10px;
    background:rgba(0,0,0,.25); border-radius:12px; margin-bottom:10px;
    display:flex; flex-direction:column; gap:8px;
  }
  .msg{max-width:85%; padding:10px 12px; border-radius:14px; font-size:14px; line-height:1.45; word-wrap:break-word}
  .msg.bot{align-self:flex-start; background:#243056; border-bottom-left-radius:4px}
  .msg.user{align-self:flex-end; background:linear-gradient(135deg,var(--accent),#3b6fe0); border-bottom-right-radius:4px}
  .row{display:flex; gap:8px}
  input,button{font-family:inherit}
  input[type=text]{
    flex:1; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.1);
    background:#0d1020; color:var(--text); font-size:15px; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  button{
    padding:12px 18px; border-radius:12px; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#3b6fe0); color:#fff;
    font-size:15px; font-weight:600; transition:.15s;
  }
  button:active{transform:scale(.97)}
  button.ghost{background:#2a3152}
  /* ---- Калькулятор ---- */
  #display{
    width:100%; text-align:right; font-size:32px; padding:16px;
    background:#0d1020; border:1px solid rgba(255,255,255,.1);
    border-radius:12px; color:var(--text); margin-bottom:10px; overflow-x:auto;
  }
  .keys{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .keys button{padding:16px 0; font-size:18px; border-radius:12px; background:#242b48}
  .keys .op{background:#2f3a66}
  .keys .eq{background:linear-gradient(135deg,var(--ok),#16a34a)}
  .keys .clr{background:linear-gradient(135deg,var(--err),#b91c1c)}
  /* ---- Тост / статус ---- */
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(120%);
    background:#0d1020; border:1px solid rgba(255,255,255,.12);
    padding:12px 18px; border-radius:12px; font-size:14px;
    transition:.35s; z-index:99; max-width:90vw;
  }
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.ok{border-color:var(--ok)}
  #toast.err{border-color:var(--err)}
  footer{text-align:center; color:var(--muted); font-size:12px; margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🤖</div>
    <div>
      <h1>Тилек</h1>
      <div class="ver" id="verLabel">v1.0.5</div>
    </div>
  </header>

  <!-- ЧАТ -->
  <div class="card">
    <h2>Тилек менен сүйлөшүү</h2>
    <div id="chat"></div>
    <div class="row">
      <input type="text" id="chatInput" placeholder="Тилекке жазыңыз..." autocomplete="off">
      <button id="sendBtn">Жөнөтүү</button>
    </div>
  </div>

  <!-- КАЛЬКУЛЯТОР -->
  <div class="card">
    <h2>Калькулятор</h2>
    <div id="display">0</div>
    <div class="keys">
      <button class="clr" data-k="C">C</button>
      <button class="op" data-k="⌫">⌫</button>
      <button class="op" data-k="%">%</button>
      <button class="op" data-k="/">÷</button>

      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button class="op" data-k="*">×</button>

      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button class="op" data-k="-">−</button>

      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button class="op" data-k="+">+</button>

      <button data-k="0">0</button>
      <button data-k=".">.</button>
      <button class="eq" data-k="=">=</button>
      <button class="op" data-k="+">+</button>
    </div>
  </div>

  <footer>Тилек • Робот & Калькулятор • v1.0.5</footer>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   ТИЛЕК — ROBOT & CALCULATOR  (v1.0.5)
   Бир файлдык колдонмо. Acode → GitHub → GitHub Pages.
   ============================================================ */

const APP_VERSION = "1.0.5";

/* ---------- Тост ---------- */
function toast(msg, type="ok"){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show " + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className = ""; }, 2600);
}

/* ---------- Чат логикасы ---------- */
const chat = document.getElementById("chat");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");

function addMsg(text, who){
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

/* Роботтун жооптору */
function robotReply(text){
  const t = text.toLowerCase().trim();

  if (/салам|привет|hello|hi|ассалам/.test(t))
    return "Салам! Мен Тилек — сиздин жардамчы роботуңуз. Кантип жардам бере алам?";
  if (/атың|ысымың|кто ты|сен ким/.test(t))
    return "Менин атым — Тилек. Мен роботмун жана калькулятор менен иштей алам. 🤖";
  if (/калькулятор|эсепте|calculate/.test(t))
    return "Төмөнкү калькуляторду колдонуңуз — же мага '5 + 3' деп жазыңыз, мен эсептейм.";
  if (/рахмат|спасибо|thanks/.test(t))
    return "Ар дайым кубаныч менен! 😊";
  if (/саламатсызбы|как дела/.test(t))
    return "Мен жакшымын, рахмат! Сиз кандайсыз?";
  if (/убакыт|время|time/.test(t))
    return "Азыркы убакыт: " + new Date().toLocaleTimeString("ky-KG");
  if (/күн|дата|date/.test(t))
    return "Бүгүн: " + new Date().toLocaleDateString("ky-KG");

  // Математикалык туюнтма текшерүү (мис: 5+3, 12*4)
  const mathMatch = t.replace(/\s/g, "").match(/^[-+*/%().\d]+$/);
  if (mathMatch && /[+\-*/%]/.test(mathMatch[0])){
    try{
      const res = safeEval(mathMatch[0]);
      if (res !== null) return "Жыйынтык: " + res;
    }catch(e){ /* өткөрүп жибер */ }
  }

  return "Кечиресиз, мен бул суроону түшүнгөн жокмун. Калькуляторду колдонуп көрүңүз же 'салам' деп жазыңыз.";
}

function handleSend(){
  const text = chatInput.value.trim();
  if (!text) return;
  addMsg(text, "user");
  chatInput.value = "";
  setTimeout(()=>{
    addMsg(robotReply(text), "bot");
  }, 350);
}

/* Enter жана басуу — submit ЖОК (sandbox үчүн коопсуз) */
sendBtn.addEventListener("click", handleSend);
chatInput.addEventListener("keydown", (e)=>{
  if (e.key === "Enter"){ e.preventDefault(); handleSend(); }
});

/* Баштоо билдирүүсү */
addMsg("Салам! Мен Тилек — роботмун. 🤖 Мага жазыңыз же калькуляторду колдонуңуз.", "bot");

/* ---------- Калькулятор ---------- */
const display = document.getElementById("display");
let expr = "";

function updateDisplay(){
  display.textContent = expr === "" ? "0" : expr;
}

/* Коопсуз эсептөө (eval'дун ордуна) */
function safeEval(str){
  // Изоляцияланган функция — eval колдонбойт
  try{
    const fn = new Function('"use strict";return (' + str + ')');
    const r = fn();
    if (typeof r === "number" && isFinite(r)) return r;
    return null;
  }catch(e){ return null; }
}

document.querySelectorAll(".keys button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const k = btn.dataset.k;
    if (k === "C"){ expr = ""; updateDisplay(); return; }
    if (k === "⌫"){ expr = expr.slice(0,-1); updateDisplay(); return; }
    if (k === "="){
      const r = safeEval(expr);
      if (r === null){
        toast("Ката: туура эмес туюнтма", "err");
      } else {
        expr = String(r);
        updateDisplay();
      }
      return;
    }
    // % — пайыз
    if (k === "%"){ expr += "/100"; updateDisplay(); return; }
    expr += k;
    updateDisplay();
  });
});
updateDisplay();

/* ---------- Версияны жаңыртуу эскертүүсү ----------
   GitHub Pages'те version.json файлын жасаңыз:
   { "version": "1.0.6" }
   Тиркеме ачканда текшерет жана эскертет.
-------------------------------------------------- */
async function checkForUpdate(){
  try{
    const res = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) return;
    const data = await res.json();
    if (data.version && data.version !== APP_VERSION){
      toast("Жаңы версия бар: v" + data.version + " — баракты жаңыртыңыз", "ok");
    }
  }catch(e){ /* version.json жок болсо — унчукпайт */ }
}

/* Баштоо */
document.getElementById("verLabel").textContent = "v" + APP_VERSION;
checkForUpdate();
</script>
</body>
</html>
