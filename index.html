<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тиля — Робот (v1.0.4)</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2e;
    --panel2: #1f2540;
    --accent: #3b82f6;
    --accent2: #22c55e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* --- Скриншот 1: Кирүү экраны --- */
  #loginScreen {
    position: fixed; inset: 0; background: rgba(15, 18, 32, 0.95); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card {
    background: var(--panel); border-radius: 20px; padding: 24px; width: 100%; max-width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05);
  }
  .login-card h2 { margin: 0 0 5px 0; font-size: 22px; }
  .login-card p { margin: 0 0 20px 0; color: var(--muted); font-size: 14px; }
  .input-group { margin-bottom: 15px; }
  .input-group input[type="password"], .input-group input[type="text"] {
    width: 100%; padding: 15px; border-radius: 12px; background: #0d1020;
    border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 16px; outline: none;
  }
  .input-group input:focus { border-color: var(--accent); }
  .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 14px; color: var(--muted); }
  .checkbox-group input { width: 18px; height: 18px; accent-color: var(--accent); }
  .btn-main {
    width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent);
    color: white; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .btn-main:active { opacity: 0.8; }
  .forgot { text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted); cursor: pointer; }

  /* --- Скриншот 2: Негизги чат --- */
  header {
    background: var(--panel); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .header-title h1 { margin: 0; font-size: 18px; }
  .header-title span { font-size: 12px; color: var(--muted); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--panel2); border: none; color: var(--text); width: 40px; height: 40px;
    border-radius: 10px; font-size: 18px; display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: #2a3152; }
  .icon-btn.lang { width: auto; padding: 0 12px; font-size: 14px; font-weight: bold; }

  #chatArea {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.4; }
  .msg.bot { background: #2a3152; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; }

  .input-area {
    background: var(--panel); padding: 12px 16px; display: flex; gap: 10px; align-items: center;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .input-area input {
    flex: 1; padding: 14px; border-radius: 12px; border: none; background: var(--panel2);
    color: white; font-size: 15px; outline: none;
  }
  .btn-send { background: var(--accent); color: white; border: none; width: 48px; height: 48px; border-radius: 12px; font-size: 20px; cursor: pointer; }
  .btn-mic { background: var(--accent2); color: white; border: none; width: 48px; height: 48px; border-radius: 12px; font-size: 20px; cursor: pointer; }

  /* --- Скриншот 3: Админ панель --- */
  #adminPanel {
    position: fixed; inset: 0; background: var(--bg); z-index: 900;
    display: none; flex-direction: column;
  }
  .admin-header { padding: 16px; display: flex; justify-content: space-between; align-items: center; background: var(--panel); }
  .admin-header h2 { margin: 0; font-size: 18px; }
  .admin-content { padding: 16px; overflow-y: auto; flex: 1; }
  .admin-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
  .admin-form input {
    padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    background: transparent; color: white; font-size: 15px; outline: none;
  }
  .admin-form input:focus { border-color: var(--accent); }
  .btn-add { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }

  .product-item {
    display: flex; justify-content: space-between; align-items: center; padding: 16px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px;
  }
  .product-info { flex: 1; font-size: 14px; line-height: 1.4; }
  .product-actions { display: flex; gap: 8px; }
  .btn-edit, .btn-del { border: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 16px; display: grid; place-items: center; color: white;}
  .btn-edit { background: #475569; }
  .btn-del { background: var(--danger); }

  /* --- Модалка / Тост --- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-box { background: var(--panel); padding: 20px; border-radius: 16px; width: 100%; max-width: 340px; }
  .modal-box h3 { margin: 0 0 15px 0; font-size: 18px; }
  .modal-box input { width: 100%; padding: 12px; border-radius: 10px; background: #0d1020; border: 1px solid #333; color: white; margin-bottom: 15px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
  .btn-cancel { background: #333; color: white; }
  .btn-save { background: var(--accent2); color: white; }

  #toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px;
    transition: 0.3s; z-index: 3000; opacity: 0; pointer-events: none; border: 1px solid #334155;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<!-- 1. КИРҮҮ ЭКРАНЫ (v1.0.4) -->
<div id="loginScreen">
  <div class="login-card">
    <h2>🔐 Кирүү / Вход</h2>
    <p>(v1.0.4)</p>
    
    <div class="input-group">
      <input type="password" id="passwordInput" placeholder="Сырсөз / Пароль">
    </div>
    
    <label class="checkbox-group">
      <input type="checkbox" id="showPassCheck" onclick="togglePassword()">
      <span>Сырсөздү көрсөт / Показать пароль</span>
    </label>
    
    <button class="btn-main" id="loginBtn">ОК</button>
    <div class="forgot">Сырсөздү унуттум (баарын өчүрөт) / Забыл пароль (стирает всё)</div>
  </div>
</div>

<!-- 2. НЕГИЗГИ БӨЛҮК -->
<header>
  <div class="header-title">
    <h1 id="botNameDisplay">Тиля</h1>
    <span id="appVersion">v1.0.4</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn lang" id="langBtn" onclick="toggleLang()">КУ</button>
    <button class="icon-btn" id="adminBtn" onclick="openAdmin()">⚙️</button>
    <button class="icon-btn" id="lockBtn" onclick="lockApp()">🔒</button>
  </div>
</header>

<div id="chatArea">
  <div class="msg bot">Салам! Мен Тиля. Товардын атын айтыңыз, баасын же жалпы суммасын эсептеп берем.</div>
</div>

<div class="input-area">
  <input type="text" id="chatInput" placeholder="Жазыңыз же 🎤 басыңыз" autocomplete="off">
  <button class="btn-send" id="sendBtn">➤</button>
  <button class="btn-mic" id="micBtn">🎤</button>
</div>

<!-- 3. АДМИН ПАНЕЛЬ -->
<div id="adminPanel">
  <div class="admin-header">
    <h2>⚙️ Админ панель</h2>
    <button class="icon-btn" onclick="closeAdmin()">✕</button>
  </div>
  <div class="admin-content">
    <h3 style="margin-top:0; font-size:16px;">Товарлар / Товары</h3>
    
    <div class="admin-form">
      <input type="text" id="prodName" placeholder="Аты / Название">
      <input type="number" id="prodPrice" placeholder="Баасы (сом) / Цена">
      <input type="text" id="prodUnit" placeholder="Өлчөмү (даана, м, кг) / Ед. изм.">
      <input type="text" id="prodAliases" placeholder="Башка аттары (үтүр менен) / Другие названия">
      <button class="btn-add" id="addProdBtn">Кошуу / Добавить</button>
    </div>

    <div id="productList">
      <!-- Товарлар ушул жерге чыгат -->
    </div>
  </div>
</div>

<!-- ОҢДОО МОДАЛКАСЫ -->
<div id="editModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Товарды оңдоо</h3>
    <input type="text" id="editName" placeholder="Аты">
    <input type="number" id="editPrice" placeholder="Баасы">
    <input type="text" id="editUnit" placeholder="Өлчөмү">
    <input type="text" id="editAliases" placeholder="Башка аттары">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEditModal()">Жокко чыгаруу</button>
      <button class="btn-save" id="saveEditBtn">Сактоо</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= НЕГИЗГИ ЛОГИКА ================= */
const APP_VERSION = "1.0.4";
const PASSWORD = "admin123";
let currentLang = "ky"; // "ky" же "ru"
let products = [];
let editId = null;

// localStorage'дон жүктөө
function loadData() {
  const saved = localStorage.getItem("tilya_products");
  if (saved) {
    products = JSON.parse(saved);
  } else {
    // Демо маалыматтар (скриншоттогудай)
    products = [
      { id: 1, name: "Кольца от 100 до 130", price: 15, unit: "шт", aliases: "Кольца" },
      { id: 2, name: "Кольца от 135 до 150", price: 25, unit: "шт", aliases: "Кольца" },
      { id: 3, name: "Кольца от 155 до 180", price: 30, unit: "шт", aliases: "Кольца" },
      { id: 4, name: "Кольца от 185 и выше", price: 50, unit: "шт", aliases: "Кольца" },
      { id: 5, name: "Светодиодная лента 3000k", price: 85, unit: "м", aliases: "Светодиодная лента" },
      { id: 6, name: "Кольца от 10 до 95", price: 10, unit: "шт", aliases: "Кольца" }
    ];
    saveData();
  }
}

function saveData() {
  localStorage.setItem("tilya_products", JSON.stringify(products));
}

/* ================= КИРҮҮ / ПАРОЛЬ ================= */
document.getElementById("loginBtn").addEventListener("click", function() {
  const pass = document.getElementById("passwordInput").value;
  if (pass === PASSWORD) {
    document.getElementById("loginScreen").style.display = "none";
    showToast("Кош келиңиз!");
  } else {
    showToast("Туура эмес сырсөз!", true);
  }
});

document.getElementById("passwordInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") document.getElementById("loginBtn").click();
});

function togglePassword() {
  const inp = document.getElementById("passwordInput");
  inp.type = inp.type === "password" ? "text" : "password";
}

document.querySelector(".forgot").addEventListener("click", function() {
  localStorage.clear();
  showToast("Баары өчүрүлдү. Баракты жаңыртыңыз.");
  setTimeout(() => location.reload(), 1500);
});

function lockApp() {
  document.getElementById("passwordInput").value = "";
  document.getElementById("loginScreen").style.display = "flex";
}

/* ================= ЧАТ ================= */
const chatArea = document.getElementById("chatArea");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");

function addMsg(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function botReply(text) {
  const t = text.toLowerCase().trim();
  if (!t) return;

  // Калькулятор текшерүү (мис: 5+3, 10*2)
  const mathMatch = t.replace(/\s/g, "").match(/^[-+*/%().\d]+$/);
  if (mathMatch && /[+\-*/%]/.test(mathMatch[0])) {
    try {
      const res = new Function('"use strict";return (' + mathMatch[0] + ')')();
      if (typeof res === "number") {
        setTimeout(() => addMsg("Жыйынтык: " + res, "bot"), 300);
        return;
      }
    } catch(e) {}
  }

  // Товар издөө
  let found = null;
  let maxScore = 0;

  products.forEach(p => {
    let score = 0;
    const pName = p.name.toLowerCase();
    const pAliases = p.aliases ? p.aliases.toLowerCase().split(",") : [];
    
    if (t.includes(pName)) score += 10;
    pAliases.forEach(alias => {
      if (t.includes(alias.trim())) score += 5;
    });

    if (score > maxScore) {
      maxScore = score;
      found = p;
    }
  });

  if (found && maxScore > 0) {
    const reply = `Товар: ${found.name}\nБаасы: ${found.price} сом / ${found.unit}`;
    setTimeout(() => addMsg(reply, "bot"), 300);
  } else {
    // Жалпы жооп
    setTimeout(() => {
      if (t.includes("салам") || t.includes("привет")) {
        addMsg("Салам! Кандай товар керек?", "bot");
      } else if (t.includes("товар") || t.includes("баа")) {
        addMsg("Товардын атын так жазыңыз же Админ панелден кошуңуз.", "bot");
      } else {
        addMsg("Мен түшүнгөн жокмун. Товардын атын жазыңыз же математикалык амал жасаңыз (мис: 5+5).", "bot");
      }
    }, 300);
  }
}

function sendMsg() {
  const text = chatInput.value.trim();
  if (!text) return;
  addMsg(text, "user");
  chatInput.value = "";
  botReply(text);
}

sendBtn.addEventListener("click", sendMsg);
chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); sendMsg(); }
});

// Микрофон (демо үчүн)
document.getElementById("micBtn").addEventListener("click", () => {
  showToast("Микрофон иштебейт (демо режим)");
});

/* ================= ТИЛ ================= */
function toggleLang() {
  currentLang = currentLang === "ky" ? "ru" : "ky";
  const btn = document.getElementById("langBtn");
  btn.textContent = currentLang === "ky" ? "КУ" : "РУ";
  
  if (currentLang === "ru") {
    document.getElementById("botNameDisplay").textContent = "Тиля";
    document.querySelector(".msg.bot").textContent = "Привет! Я Тиля. Назовите товар, и я посчитаю цену или общую сумму.";
    chatInput.placeholder = "Напишите или нажмите 🎤";
  } else {
    document.getElementById("botNameDisplay").textContent = "Тиля";
    document.querySelector(".msg.bot").textContent = "Салам! Мен Тиля. Товардын атын айтыңыз, баасын же жалпы суммасын эсептеп берем.";
    chatInput.placeholder = "Жазыңыз же 🎤 басыңыз";
  }
}

/* ================= АДМИН ПАНЕЛЬ ================= */
function openAdmin() {
  document.getElementById("adminPanel").style.display = "flex";
  renderProducts();
}

function closeAdmin() {
  document.getElementById("adminPanel").style.display = "none";
}

document.getElementById("addProdBtn").addEventListener("click", () => {
  const name = document.getElementById("prodName").value.trim();
  const price = parseFloat(document.getElementById("prodPrice").value);
  const unit = document.getElementById("prodUnit").value.trim() || "даана";
  const aliases = document.getElementById("prodAliases").value.trim();

  if (!name || isNaN(price)) {
    showToast("Атын жана баасын толук жазыңыз!", true);
    return;
  }

  products.push({
    id: Date.now(),
    name: name,
    price: price,
    unit: unit,
    aliases: aliases
  });
  
  saveData();
  renderProducts();
  
  // Форманы тазалоо
  document.getElementById("prodName").value = "";
  document.getElementById("prodPrice").value = "";
  document.getElementById("prodUnit").value = "";
  document.getElementById("prodAliases").value = "";
  
  showToast("Товар кошулду!");
});

function renderProducts() {
  const list = document.getElementById("productList");
  list.innerHTML = "";
  
  products.forEach(p => {
    const item = document.createElement("div");
    item.className = "product-item";
    
    const info = document.createElement("div");
    info.className = "product-info";
    info.innerHTML = `<b>${p.name}</b> — ${p.price} сом / ${p.unit}<br><small style="color:#94a3b8">(${p.aliases || '-'})</small>`;
    
    const actions = document.createElement("div");
    actions.className = "product-actions";
    
    const editBtn = document.createElement("button");
    editBtn.className = "btn-edit";
    editBtn.innerHTML = "✏️";
    editBtn.addEventListener("click", () => openEditModal(p.id));
    
    const delBtn = document.createElement("button");
    delBtn.className = "btn-del";
    delBtn.innerHTML = "🗑️";
    delBtn.addEventListener("click", () => deleteProduct(p.id));
    
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    item.appendChild(info);
    item.appendChild(actions);
    list.appendChild(item);
  });
}

function deleteProduct(id) {
  // Confirm ордуна түз өчүрөбүз (sandbox үчүн)
  products = products.filter(p => p.id !== id);
  saveData();
  renderProducts();
  showToast("Товар өчүрүлдү!");
}

function openEditModal(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  
  editId = id;
  document.getElementById("editName").value = p.name;
  document.getElementById("editPrice").value = p.price;
  document.getElementById("editUnit").value = p.unit;
  document.getElementById("editAliases").value = p.aliases || "";
  
  document.getElementById("editModal").style.display = "flex";
}

function closeEditModal() {
  document.getElementById("editModal").style.display = "none";
  editId = null;
}

document.getElementById("saveEditBtn").addEventListener("click", () => {
  if (!editId) return;
  const p = products.find(x => x.id === editId);
  if (p) {
    p.name = document.getElementById("editName").value.trim();
    p.price = parseFloat(document.getElementById("editPrice").value) || 0;
    p.unit = document.getElementById("editUnit").value.trim() || "даана";
    p.aliases = document.getElementById("editAliases").value.trim();
    
    saveData();
    renderProducts();
    closeEditModal();
    showToast("Товар оңдолду!");
  }
});

/* ================= ТОСТ ================= */
function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.borderColor = isError ? "var(--danger)" : "var(--accent)";
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    t.classList.remove("show");
  }, 2500);
}

/* ================= БАШТОО ================= */
loadData();
</script>
</body>
</html>
