    <style>
        /* Дизайн стилдери (Скриншотко окшоштурулду) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            padding-bottom: 50px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #1f2335;
            position: sticky;
            top: 0;
            background-color: #0f111a;
            z-index: 10;
        }

        .header h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .header h1 span {
            color: #4a90e2; /* Көк шестерня */
        }

        .close-btn {
            background-color: #1a1e2d;
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-list {
            display: flex;
            flex-direction: column;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #1f2335;
        }

        .product-info {
            flex: 1;
            padding-right: 15px;
        }

        .product-title {
            font-size: 15px;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .product-category {
            font-size: 13px;
            color: #6b7280;
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-edit {
            background-color: #3b4256;
        }

        .btn-delete {
            background-color: #ff4757;
        }

        /* Карандаш жана урна белгилери (SVG) */
        .icon-edit {
            width: 20px;
            height: 20px;
            fill: #f1c40f; /* Сары түс */
        }

        .icon-delete {
            width: 20px;
            height: 20px;
            fill: #ffffff; 
        }
    </style>
</head>

        // ==========================================
        // 2. ТОВАРЛАРДЫ ЭКРАНГА ЧЫГАРУУ ФУНКЦИЯСЫ
        // ==========================================
        const productList = document.getElementById('productList');

        function renderProducts() {
            productList.innerHTML = ''; // Мурунку тизмени тазалоо

            products.forEach(product => {
                // Ар бир товар үчүн div түзөбүз
                const itemDiv = document.createElement('div');
                itemDiv.className = 'product-item';

                itemDiv.innerHTML = `
                    <div class="product-info">
                        <div class="product-title">${product.name} — ${product.price} ${product.unit}</div>
                        <div class="product-category">(${product.category})</div>
                    </div>
                    <div class="product-actions">
                        <button class="btn btn-edit" onclick="editProduct(${product.id})">
                            <svg class="icon-edit" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        </button>
                        <button class="btn btn-delete" onclick="deleteProduct(${product.id})">
                            <svg class="icon-delete" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `;
                productList.appendChild(itemDiv);
            });
        }

        // ==========================================
        // 3. БАСКЫЧТАРДЫН ИШТЕШИ (Функциялар)
        // ==========================================
        function editProduct(id) {
            const product = products.find(p => p.id === id);
            alert(`Өзгөртүү баскычы басылды.\nТовар: ${product.name}\nБаасы: ${product.price} ${product.unit}`);
            // Бул жерге өзүңүздүн өзгөртүү терезеңиздин (модал) кодун жасасаңыз болот
        }

        function deleteProduct(id) {
            const confirmDelete = confirm("Бул товарды чын эле өчүрүүнү каалайсызбы?");
            if (confirmDelete) {
                // Базадан өчүрүү
                const index = products.findIndex(p => p.id === id);
                if (index > -1) {
                    products.splice(index, 1);
                    renderProducts(); // Экранды жаңылоо
                }
            }
        }

        // Сайт ачылганда товарларды чыгаруу
        renderProducts();
